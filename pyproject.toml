[project]
name = "papers-cli"
version = "0.3.0"
description = "A local-first CLI for finding, downloading, and verifying research papers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "httpx>=0.27,<1",
  "platformdirs>=4.11.11,<5",
  "pypdf>=6.19,<7",
]

[project.scripts]
papers = "papers_cli.cli:main"

[dependency-groups]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.8,<1",
  "types-defusedxml>=0.7,<1",
]

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papers_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true
